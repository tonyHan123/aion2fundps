name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Aion2FunDps.slnx

      - name: Build (Release)
        run: dotnet build Aion2FunDps.slnx --no-restore --configuration Release

      - name: Test (when tests exist)
        run: dotnet test Aion2FunDps.slnx --no-build --configuration Release --verbosity normal
        continue-on-error: true
